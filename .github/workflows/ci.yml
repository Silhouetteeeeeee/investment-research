name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 不跑 LiveSkillSmoke / QuestionBankEval：都要真实 DEEPSEEK_API_KEY
      - run: ./mvnw -B verify
      - run: ./mvnw -B spotless:check
