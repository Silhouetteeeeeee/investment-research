services:
  app:
    build: .
    image: investment-research:latest
    restart: unless-stopped
    ports:
      # Only the app port is published. The management port (8081) stays inside
      # the container and is reachable only by the image's HEALTHCHECK.
      - "80:8080"
    environment:
      # Fails compose up loudly instead of starting tokenless and crash-looping.
      APP_API_TOKEN: ${APP_API_TOKEN:?APP_API_TOKEN 未设置，请先写进 .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      XQ_TOKEN: ${XQ_TOKEN}
      APP_DATA_DIR: /app/var
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes:
      - ./var:/app/var
      - ./skills:/app/skills:ro
    # graceful shutdown budgets 30s; give Docker a little more before SIGKILL.
    stop_grace_period: 35s

  # Reserved for later phases: config only, the app does not depend on them yet.
  redis:
    profiles: ["future"]
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    profiles: ["future"]
    image: rabbitmq:3-management-alpine
    restart: unless-stopped

  otel-collector:
    profiles: ["future"]
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
