spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # 盘中轮询、阶段耗时与 SSE 心跳各占一个线程
      pool:
        size: 4
  datasource:
    url: jdbc:sqlite:file:${APP_DATA_DIR:./var}/app.db?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration/sqlite
  web:
    resources:
      static-locations: file:./frontend/

app:
  # 静态访问令牌；未设置时启动失败（ApiTokenProperties 校验）
  api-token: ${APP_API_TOKEN:}
  trading:
    # 非交易日不会运行；这里只是总开关
    enabled: ${APP_TRADING_ENABLED:true}
    poll-seconds: 10

server:
  # SIGTERM 后停止接收新请求并等待进行中的请求（含 SSE）结束
  shutdown: graceful

management:
  server:
    # 管理端口独立，compose 不发布；容器健康检查走 127.0.0.1:8081
    port: 8081
    # 只听回环：容器内健康检查照常可用，裸机运行时也不把健康页暴露到局域网
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
